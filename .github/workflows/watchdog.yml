name: Data Watchdog

on:
  # Pure safety net: daily check that the sync itself is still alive.
  # The DAILY ntfy push lives in sync.yml's "notify" job (runs right after the
  # sync completes) — do not add NOTIFY_ALWAYS here or you will double-push.
  # STALE alert (manifest older than max-age-hours) catches a sync that stopped
  # running entirely; on all-checks-pass this job stays SILENT (NOTIFY_ALWAYS=0).
  # 23:23 UTC = 9:23 AM AEST, ~1.5h after the sync normally completes, on an
  # off-peak minute (avoids the cron queue congestion of top/half-hour slots).
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run data-quality watchdog (alerts when sync/manifest indicates a problem)
        run: node scripts/watchdog.mjs
        env:
          WATCHDOG_MANIFEST_URL: ${{ secrets.WATCHDOG_MANIFEST_URL }}
          WATCHDOG_WEBHOOK_URL: ${{ secrets.WATCHDOG_WEBHOOK_URL }}
          WATCHDOG_NTFY_TOPIC: ${{ secrets.WATCHDOG_NTFY_TOPIC }}
          # Scheduled safety net pushes only when something is actually wrong
          # (the daily "all clear" belongs to sync.yml's notify job). Manual
          # dispatch runs always push, for testing the notification path.
          WATCHDOG_NOTIFY_ALWAYS: ${{ github.event_name == 'schedule' && '0' || '1' }}
          # If the daily sync stopped running entirely, this morning-after check
          # is what notices: manifest older than 36h => STALE => alert.
          WATCHDOG_MAX_AGE_HOURS: '36'