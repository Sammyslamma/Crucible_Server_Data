name: Data Watchdog

on:
  # Safety net: periodic check even if the sync itself silently stops.
  # STALE alert (manifest too old) catches a dead sync; duplicates are harmless.
  schedule:
    - cron: '15 23 * * *'
  workflow_run:
    workflows: ["Sync Scryfall + MTGJson"]
    types: [completed]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run data-quality watchdog (alerts when sync/manifest indicates a problem)
        run: node scripts/watchdog.mjs
        env:
          WATCHDOG_MANIFEST_URL: ${{ secrets.WATCHDOG_MANIFEST_URL }}
          WATCHDOG_WEBHOOK_URL: ${{ secrets.WATCHDOG_WEBHOOK_URL }}
          WATCHDOG_NTFY_TOPIC: ${{ secrets.WATCHDOG_NTFY_TOPIC }}
          WATCHDOG_NOTIFY_ALWAYS: '1'