name: Data Watchdog

on:
  # Primary trigger: fires the moment the sync workflow completes, so the daily
  # ntfy push reports a manifest that JUST finished generating ("generated 5m
  # ago"), not one that is about to be replaced by the next sync (~24h old).
  workflow_run:
    workflows: ["Sync Scryfall + MTGJson"]
    types: [completed]
  # Safety net: daily check even if the sync itself silently stops running.
  # STALE alert (manifest older than max-age-hours) catches a dead sync.
  # Quiet on success (see NOTIFY_ALWAYS below) so it does not double-push.
  schedule:
    - cron: '15 23 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run data-quality watchdog (alerts when sync/manifest indicates a problem)
        run: node scripts/watchdog.mjs
        env:
          WATCHDOG_MANIFEST_URL: ${{ secrets.WATCHDOG_MANIFEST_URL }}
          WATCHDOG_WEBHOOK_URL: ${{ secrets.WATCHDOG_WEBHOOK_URL }}
          WATCHDOG_NTFY_TOPIC: ${{ secrets.WATCHDOG_NTFY_TOPIC }}
          # Post-sync (workflow_run) and manual runs: always push, so the daily
          # "all clear" arrives with a just-generated manifest. The safety-net
          # cron pushes only when something is actually wrong - no redundant
          # ~24h-old "all clear" every day.
          WATCHDOG_NOTIFY_ALWAYS: ${{ github.event_name == 'schedule' && '0' || '1' }}
          # On the post-sync trigger the manifest was just written, so anything
          # older than 4h means THIS sync failed to build/deploy and must alert
          # even though every other check still passes against yesterday's data.
          WATCHDOG_MAX_AGE_HOURS: ${{ github.event_name == 'workflow_run' && '4' || '36' }}