name: Sync Scryfall + MTGJson

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull

      - run: NODE_OPTIONS="--max-old-space-size=4096" npm run sync

      - name: Deploy data to data branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Switch to an orphan branch (no history from main)
          git checkout --orphan data

          # Remove everything except the generated docs
          git rm -rf .

          # Move generated files from docs/ to the root of the data branch
          mv docs/* . 2>/dev/null || true

          # Add and commit only the data files
          git add *.json.gz manifest.json
          git commit -m "Auto-deploy data: $(date)"

          # Force push to the data branch (rewriting history is fine — data snapshots)
          git push origin data --force