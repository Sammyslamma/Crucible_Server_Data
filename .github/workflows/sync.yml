name: Sync Scryfall + MTGJson

on:
  # 21:43 UTC = 7:43 AM AEST. Scryfall regenerates bulk data ~21:00-21:15 UTC
  # and MTGJSON files go live ~14:00 UTC, so both sources are guaranteed fresh.
  # The :43 offset avoids GitHub Actions' cron peak load (top/half of the hour),
  # which was delaying the previous 22:30 slot by 1.5-2h or dropping it entirely.
  schedule:
    - cron: '43 21 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - run: npm install

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull

      - run: NODE_OPTIONS="--max-old-space-size=4096" npm run sync

      - name: Deploy data to data branch
        run: |

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Switch to an orphan branch (no history from main)
          git checkout --orphan data

          # Remove everything except the generated docs
          git rm -rf .

          # Move generated files from docs/ to the root of the data branch
          mv docs/* . 2>/dev/null || true

          # Add and commit only the data files
          git add *.json.gz manifest.json
          git commit -m "Auto-deploy data: $(date)"

          # Force push to the data branch (rewriting history is fine — data snapshots)
          git push origin data --force
  notify:
    # The daily ntfy push — deterministic, same workflow, no second scheduler,
    # no workflow_run event bus (which has never fired for this repo).
    # Runs immediately when the sync job finishes, success OR failure:
    #   - Sync succeeded  -> watchdog checks the just-deployed manifest and
    #                       pushes the "all clear" (NOTIFY_ALWAYS=1).
    #   - Sync failed and deployed nothing -> the live manifest is yesterday's,
    #                       so the Freshness check (MAX_AGE_HOURS=4) FAILS and
    #                       a high-priority alert is pushed instead.
    name: Watchdog notify (post-sync)
    runs-on: ubuntu-latest
    needs: [sync]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run watchdog and push ntfy report
        run: node scripts/watchdog.mjs
        env:
          # Cache-busted live URL (default) so the just-pushed manifest is
          # fetched fresh, not a stale CDN copy.
          WATCHDOG_MANIFEST_URL: ${{ secrets.WATCHDOG_MANIFEST_URL }}
          WATCHDOG_WEBHOOK_URL: ${{ secrets.WATCHDOG_WEBHOOK_URL }}
          WATCHDOG_NTFY_TOPIC: ${{ secrets.WATCHDOG_NTFY_TOPIC }}
          WATCHDOG_NOTIFY_ALWAYS: '1'
          # The sync just finished (or failed). A manifest older than 4h means
          # this run did not build/deploy — must alert even though every other
          # check still passes against yesterday's data.
          WATCHDOG_MAX_AGE_HOURS: '4'
